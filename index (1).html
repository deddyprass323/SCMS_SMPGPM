        // Safe JSON LocalStorage parser with fallback
        function safeLocalStorageGet(key, fallbackValue) {
            try {
                const item = localStorage.getItem(key);
                if (!item) return fallbackValue;
                return JSON.parse(item);
            } catch (err) {
                console.warn(`Localstorage load error for key ${key}:`, err);
                return fallbackValue;
            }
        }

        // Helper functions
        function getStartOfWeek(dateStr) {
            if (!dateStr) return new Date().toISOString().split('T')[0];
            const d = new Date(dateStr);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            return monday.toISOString().split('T')[0];
        }

        function getEndOfWeek(dateStr) {
            if (!dateStr) return new Date().toISOString().split('T')[0];
            const d = new Date(dateStr);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? 0 : 7);
            const sunday = new Date(d.setDate(diff));
            return sunday.toISOString().split('T')[0];
        }

        function getDayNameIndonesian(dateStr) {
            if (!dateStr) return "-";
            const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const d = new Date(dateStr);
            return days[d.getDay()] || "-";
        }

        /**
         * Validates and formats Indonesian phone numbers according to WhatsApp standards.
         * Converts leading 0 to 62, handles existing 62, strips invalid characters.
         * Returns clean digits without '+' or spaces.
         */
        function formatWaPhone(phone) {
            if (!phone) return { clean: '', isValid: false, formatted: '-', error: 'Nomor telepon orang tua belum diisi.' };
            let cleaned = String(phone).replace(/[^0-9]/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '62' + cleaned.substring(1);
            } else if (cleaned.startsWith('8')) {
                cleaned = '62' + cleaned;
            }
            if (cleaned.startsWith('6262')) {
                cleaned = cleaned.substring(2);
            }

            // Validates 62 followed by 8-13 digits
            const isValid = /^62[8][0-9]{7,12}$/.test(cleaned);
            return {
                clean: cleaned,
                isValid: isValid,
                formatted: isValid ? `+${cleaned}` : (cleaned ? `+${cleaned} (Format Tidak Valid)` : '-'),
                error: isValid ? '' : 'Nomor HP tidak valid untuk WhatsApp Indonesia. Harus diawali 08... atau 628... (8-13 digit).'
            };
        }

        // Safe clipboard copy helper for browser/iframe environment
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Copy fallback failed:', err);
            }
            document.body.removeChild(textarea);
        }

            const rules = isGood ? SCM_RULES.goodConducts : SCM_RULES.misconducts;
            for (const lvl of rules) {
                const item = lvl.items.find(i => i.id === ruleId);
                if (item) return `[${item.id}] ${item.desc}`;
            }
            return ruleId || "-";
        }

        function CustomNoticeModal({ notice, onClose }) {
            if (!notice) return null;
            return (
                <div className="fixed inset-0 z-[100] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center animate-in fade-in zoom-in duration-200">
                        <div className={`w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl ${
                            notice.type === 'danger' ? 'bg-rose-100 text-rose-600' :
                            notice.type === 'confirm' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'
                        }`}>
                            <i className={`fa-solid ${
                                notice.type === 'danger' ? 'fa-triangle-exclamation' :
                                notice.type === 'confirm' ? 'fa-circle-question' : 'fa-circle-check'
                            }`}></i>
                        </div>
                        <div>
                            <h3 className="font-extrabold text-base text-slate-900">{notice.title || "Pemberitahuan"}</h3>
                            <p className="text-xs text-slate-600 mt-1 whitespace-pre-line">{notice.message}</p>
                        </div>
                        <div className="flex justify-center gap-2 pt-2">
                            {notice.onConfirm ? (
                                <>
                                    <button onClick={onClose} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs flex-1">
                                        Batal
                                    </button>
                                    <button onClick={() => { notice.onConfirm(); onClose(); }} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs flex-1 shadow">
                                        Ya, Lanjutkan

                                </>

                                    Mengerti
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#1e3a8a';

                if (initialSig) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = initialSig;
                }
            }, [initialSig]);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                setHasSigned(true);
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (canvasRef.current) {
                    const dataUrl = canvasRef.current.toDataURL();
                    onSave(dataUrl);
                }
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setHasSigned(false);
                onSave("");
            };

            return (
                <div className="space-y-2">
                    <div className="flex justify-between items-center">
                        <label className="block font-bold text-xs text-slate-700">{title}</label>
                        <button type="button" onClick={clearCanvas} className="text-[11px] text-rose-600 font-bold hover:underline">
                            <i className="fa-solid fa-eraser mr-1"></i>Hapus TTD
                        </button>
                    </div>
                    <div className="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-white shadow-inner relative">
                        <canvas
                            ref={canvasRef}
                            width={380}
                            height={130}
                            className="sig-canvas w-full h-32"
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                        />
                        {!hasSigned && (
                            <div className="absolute inset-0 pointer-events-none flex items-center justify-center text-slate-300 text-xs font-semibold">
                                Usap / sentuh di sini untuk tanda tangan
                            </div>
                        )}
                    </div>
                </div>
            );
        }

            useEffect(() => { localStorage.setItem('scms_v8_bad', JSON.stringify(misconducts)); }, [misconducts]);

                const map = {};
                students.forEach(s => map[s.id] = 0);
                goodConducts.forEach(g => {

                const todayFollowUps = misconducts.filter(m => m.status === 'Dalam Pembinaan');

                return {
                    totalStudents: students.length,
                    todayGoodCount: todayGood.length,
                    todayBadCount: todayBad.length,
                    activePembinaanCount: todayFollowUps.length,
                    todayGood,
                    todayBad

            /**
             * Universal WhatsApp Status Updater.
             * Supported statuses:
             * - 'Belum Diproses'
             * - 'Menunggu Konfirmasi'
             * - 'Terkirim (Konfirmasi Petugas)'
             * - 'Gagal'
             * - 'Dilewati'
             */
            const handleUpdateWaStatus = (itemId, isGood, status, method = 'Otomatis WA (Klik)', sentBy = null, note = null) => {
                const nowStr = new Date().toLocaleString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const operatorName = sentBy || currentUser?.name || 'Petugas SCMS';

                const updatePayload = (item) => {
                    const isConfirmedSent = status.includes('Terkirim');
                    return {
                        ...item,
                        waStatus: status,
                        waSentAt: isConfirmedSent ? (item.waSentAt || nowStr) : item.waSentAt,
                        waSendMethod: method || item.waSendMethod || 'Otomatis WA (Klik)',
                        waSentBy: operatorName,
                        waNote: note !== null ? note : item.waNote
                    };
                };

                if (isGood) {
                    setGoodConducts(prev => prev.map(g => g.id === itemId ? updatePayload(g) : g));

                    setMisconducts(prev => prev.map(m => m.id === itemId ? updatePayload(m) : m));

                                        <button type="button" onClick={() => setShowYearModal(false)} className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-emerald-700 text-white font-bold rounded-xl shadow">Simpan Perubahan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {printModalData && (
                        <PrintDocumentModal data={printModalData} school={school} onClose={() => setPrintModalData(null)} />
                    )}

                    {/* Integrated Dual Conduct Slip JPEG Modal */}
                    {parentReportJpegModal && (
                        <ConductSlipJpegModal conductData={parentReportJpegModal} school={school} students={students} users={users} currentUser={currentUser} onClose={() => setParentReportJpegModal(null)} onUpdateWaStatus={handleUpdateWaStatus} triggerNotice={triggerNotice} setPreviewWaModalData={setPreviewWaModalData} />
                    )}

                    {/* Modal Preview / Edit Pesan WA Sebelum Kirim */}
                    {previewWaModalData && (
                        <WaPreviewEditModal modalData={previewWaModalData} school={school} students={students} currentUser={currentUser} onClose={() => setPreviewWaModalData(null)} onUpdateWaStatus={handleUpdateWaStatus} triggerNotice={triggerNotice} />
                    )}
                </div>
            );
        }

        function MenuItem({ icon, label, active, onClick }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-xs font-bold transition ${
                        active 
                            ? 'bg-emerald-700 text-white shadow-lg shadow-emerald-700/30' 
                            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                >
                    <i className={`fa-solid ${icon} text-sm w-5 text-center`}></i>
                    <span>{label}</span>
                </button>
            );
        }

        // ==========================================
        // VIEW: DASHBOARD
        // ==========================================
        function DashboardView({ dailyMetrics, todayStr, students, school, setParentReportJpegModal }) {
            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white rounded-3xl p-6 md:p-8 shadow-xl relative overflow-hidden">
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span className="px-3 py-1 bg-emerald-500/20 text-emerald-200 text-xs font-semibold rounded-full border border-emerald-400/30">
                                    <i className="fa-solid fa-calendar-day mr-1.5"></i> Tahun Ajaran {school.academicYear} ({school.semester})
                                </span>
                                <h2 className="text-2xl font-black mt-2">Dashboard Rekapitulasi Hari Ini</h2>
                                <p className="text-emerald-200 text-xs mt-0.5">Pantauan peristiwa conduct, apresiasi, dan kasus terbaru tanggal <b>{todayStr}</b>.</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <MetricCard title="Total Siswa Aktif" value={dailyMetrics.totalStudents} icon="fa-user-graduate" color="blue" subtitle="Data Master Siswa" />
                        <MetricCard title="Good Conducts Hari Ini" value={dailyMetrics.todayGoodCount} icon="fa-award" color="emerald" subtitle={`Tanggal ${todayStr}`} />
                        <MetricCard title="Misconducts Hari Ini" value={dailyMetrics.todayBadCount} icon="fa-triangle-exclamation" color="rose" subtitle={`Tanggal ${todayStr}`} />
                        <MetricCard title="Siswa Dalam Pembinaan" value={dailyMetrics.activePembinaanCount} icon="fa-hourglass-half" color="amber" subtitle="Status Aktif BK" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <i className="fa-solid fa-award text-emerald-600"></i>
                                Good Conducts Hari Ini ({todayStr})
                            </h3>
                            {dailyMetrics.todayGood.length > 0 ? (
                                <div className="space-y-2">
                                    {dailyMetrics.todayGood.map(g => {
                                        const st = students.find(s => s.id === g.studentId);
                                        return (
                                            <div key={g.id} className="p-3 bg-emerald-50/60 border border-emerald-100 rounded-xl flex items-center justify-between text-xs">
                                                <div>
                                                    <span className="font-bold text-slate-900 block">{st?.name || "Siswa"} ({g.class})</span>
                                                    <span className="text-[11px] text-slate-600">{g.description}</span>
                                                </div>
                                                <button onClick={() => setParentReportJpegModal({ conduct: g, isGood: true })} className="px-2.5 py-1 bg-emerald-600 text-white font-extrabold rounded-lg text-xs hover:bg-emerald-700 shadow">
                                                    Slip JPEG
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <p className="text-xs text-slate-400 italic text-center py-6">Belum ada catatan Good Conducts diinput hari ini.</p>
                            )}
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <i className="fa-solid fa-triangle-exclamation text-rose-600"></i>
                                Misconducts Hari Ini ({todayStr})
                            </h3>
                            {dailyMetrics.todayBad.length > 0 ? (
                                <div className="space-y-2">
                                    {dailyMetrics.todayBad.map(m => {
                                        const st = students.find(s => s.id === m.studentId);
                                        return (
                                            <div key={m.id} className="p-3 bg-rose-50/60 border border-rose-100 rounded-xl flex items-center justify-between text-xs">
                                                <div>
                                                    <span className="font-bold text-slate-900 block">{st?.name || "Siswa"} ({m.class})</span>
                                                    <span className="text-[11px] text-slate-600">{m.description}</span>
                                                </div>
                                                <button onClick={() => setParentReportJpegModal({ conduct: m, isGood: false })} className="px-2.5 py-1 bg-rose-600 text-white font-extrabold rounded-lg text-xs hover:bg-rose-700 shadow">
                                                    Slip JPEG
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <p className="text-xs text-slate-400 italic text-center py-6">Belum ada laporan Misconducts diinput hari ini.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function MetricCard({ title, value, icon, color, subtitle }) {
            const colorMap = {
                blue: "bg-blue-50 text-blue-600 border-blue-200",
                emerald: "bg-emerald-50 text-emerald-600 border-emerald-200",
                rose: "bg-rose-50 text-rose-600 border-rose-200",
                amber: "bg-amber-50 text-amber-600 border-amber-200"
            };
            return (
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p className="text-xs font-bold text-slate-500">{title}</p>
                        <h3 className="text-2xl font-black text-slate-900 mt-1">{value}</h3>
                        <p className="text-[10px] text-slate-400 font-medium mt-0.5">{subtitle}</p>
                    </div>
                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center border ${colorMap[color]}`}>
                        <i className={`fa-solid ${icon} text-lg`}></i>
                    </div>
                </div>
            );
        }

        // ==========================================
        // VIEW: STUDENTS MANAGEMENT (ADMIN ONLY)
        // ==========================================
        function StudentsView({ students, setStudents, classList, setClassList, goodConducts, setGoodConducts, misconducts, setMisconducts, currentUser, studentPointsMap, triggerNotice }) {
            const [search, setSearch] = useState('');
            const [selectedClassFilter, setSelectedClassFilter] = useState('Semua');
            const [showModal, setShowModal] = useState(false);
            
            const [showClassModal, setShowClassModal] = useState(false);
            const [newClassName, setNewClassName] = useState('');
            const [editingClassIndex, setEditingClassIndex] = useState(null);
            const [editingClassNameValue, setEditingClassNameValue] = useState('');

            const [editingStudent, setEditingStudent] = useState(null);
            const [formData, setFormData] = useState({ photo: '', nis: '', name: '', gender: 'L', class: classList[0] || 'VII-A', parentName: '', parentPhone: '' });

            const [selectedIds, setSelectedIds] = useState([]);

            const isAdmin = currentUser.role === 'Administrator';

            const filtered = useMemo(() => {
                return students.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(search.toLowerCase()) || s.nis.includes(search);
                    const matchesClass = selectedClassFilter === 'Semua' || s.class === selectedClassFilter;
                    return matchesSearch && matchesClass;
                });
            }, [students, search, selectedClassFilter]);

            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    setSelectedIds(filtered.map(s => s.id));
                } else {
                    setSelectedIds([]);
                }
            };

            const handleToggleSelect = (id) => {
                if (selectedIds.includes(id)) {
                    setSelectedIds(selectedIds.filter(item => item !== id));
                } else {
                    setSelectedIds([...selectedIds, id]);
                }
            };

            const handleBulkDelete = () => {
                if (!isAdmin) return;
                if (selectedIds.length === 0) return;

                triggerNotice(
                    `Apakah Anda yakin ingin menghapus ${selectedIds.length} nama siswa yang dicentang secara sekaligus?`,
                    "Konfirmasi Hapus Banyak Siswa",
                    "confirm",
                    () => {
                        setStudents(students.filter(s => !selectedIds.includes(s.id)));
                        setSelectedIds([]);
                        triggerNotice(`Berhasil menghapus ${selectedIds.length} data siswa.`, "Sukses", "success");
                    }
                );
            };

            const handleDownloadTemplate = () => {
                const templateData = [
                    { "NIS": "26006", "Nama Lengkap": "Budi Rahardjo", "Jenis Kelamin (L/P)": "L", "Kelas": classList[0] || "VII-A", "Nama Orang Tua": "Sutrisno", "No HP Orang Tua": "081234567890" },
                    { "NIS": "26007", "Nama Lengkap": "Dewi Sartika", "Jenis Kelamin (L/P)": "P", "Kelas": classList[1] || "VIII-A", "Nama Orang Tua": "Bambang", "No HP Orang Tua": "081987654321" }
                ];
                const worksheet = XLSX.utils.json_to_sheet(templateData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Format_Data_Siswa");
                XLSX.writeFile(workbook, "Format_Import_Data_Siswa_SCMS.xlsx");
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const workbook = XLSX.read(bstr, { type: 'binary' });
                        const wsname = workbook.SheetNames[0];
                        const ws = workbook.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        const newImportedStudents = data.map((row, index) => ({
                            id: Date.now() + index,
                            photo: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80",
                            nis: String(row["NIS"] || `2600${index + 10}`),
                            name: String(row["Nama Lengkap"] || "Siswa Tanpa Nama"),
                            gender: String(row["Jenis Kelamin (L/P)"] || "L").toUpperCase().startsWith("P") ? "P" : "L",
                            class: String(row["Kelas"] || classList[0] || "VII-A"),
                            parentName: String(row["Nama Orang Tua"] || "-"),
                            parentPhone: String(row["No HP Orang Tua"] || "-"),
                            status: "Aktif"
                        }));

                        setStudents([...newImportedStudents, ...students]);
                        triggerNotice(`Berhasil mengimpor ${newImportedStudents.length} data siswa dari file Excel!`, "Sukses Import", "success");
                    } catch (err) {
                        triggerNotice("Gagal membaca file Excel. Pastikan format sesuai template.", "Gagal Import", "danger");
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handlePhotoFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData({ ...formData, photo: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveStudent = (e) => {
                e.preventDefault();
                if (!isAdmin) return;

                if (editingStudent) {
                    setStudents(students.map(s => s.id === editingStudent.id ? { ...s, ...formData } : s));
                    triggerNotice("Data siswa berhasil diperbarui!", "Sukses", "success");
                } else {
                    const newStudent = {
                        ...formData,
                        id: Date.now(),
                        photo: formData.photo || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80",
                        status: 'Aktif'
                    };
                    setStudents([newStudent, ...students]);
                    triggerNotice("Siswa baru berhasil ditambahkan!", "Sukses", "success");
                }
                setShowModal(false);
                setEditingStudent(null);
            };

            const handleDeleteSingle = (student) => {
                if (!isAdmin) return;
                triggerNotice(
                    `Apakah Anda yakin ingin menghapus data siswa ${student.name}?`,
                    "Konfirmasi Hapus",
                    "confirm",
                    () => {
                        setStudents(students.filter(s => s.id !== student.id));
                        setSelectedIds(selectedIds.filter(id => id !== student.id));
                        triggerNotice("Data siswa berhasil dihapus.", "Terhapus", "success");
                    }
                );
            };

            const handleAddClass = (e) => {
                e.preventDefault();
                const trimmed = newClassName.trim();
                if (trimmed && !classList.includes(trimmed)) {
                    setClassList([...classList, trimmed]);
                    setNewClassName('');
                    triggerNotice(`Kelas ${trimmed} berhasil ditambahkan.`, "Sukses", "success");
                } else if (classList.includes(trimmed)) {
                    triggerNotice(`Nama kelas ${trimmed} sudah ada!`, "Peringatan", "danger");
                }
            };

            const handleUpdateClassName = (oldName) => {
                const newName = editingClassNameValue.trim();
                if (!newName) return;
                if (newName === oldName) {
                    setEditingClassIndex(null);
                    return;
                }
                if (classList.includes(newName)) {
                    triggerNotice(`Nama kelas ${newName} sudah digunakan!`, "Peringatan", "danger");
                    return;
                }

                const updatedList = classList.map(c => c === oldName ? newName : c);
                setClassList(updatedList);
                setStudents(students.map(s => s.class === oldName ? { ...s, class: newName } : s));
                setGoodConducts(goodConducts.map(g => g.class === oldName ? { ...g, class: newName } : g));
                setMisconducts(misconducts.map(m => m.class === oldName ? { ...m, class: newName } : m));

                setEditingClassIndex(null);
                setEditingClassNameValue('');
                triggerNotice(`Nama kelas ${oldName} telah diubah menjadi ${newName}.`, "Sukses Ubah Kelas", "success");
            };

            const handleDeleteClass = (classNameToDelete) => {
                const inUseCount = students.filter(s => s.class === classNameToDelete).length;
                if (inUseCount > 0) {
                    triggerNotice(`Kelas ${classNameToDelete} tidak dapat dihapus karena masih digunakan oleh ${inUseCount} siswa.`, "Tidak Dapat Dihapus", "danger");
                    return;
                }

                triggerNotice(
                    `Apakah Anda yakin ingin menghapus nama kelas ${classNameToDelete}?`,
                    "Hapus Kelas",
                    "confirm",
                    () => {
                        setClassList(classList.filter(c => c !== classNameToDelete));
                        triggerNotice(`Kelas ${classNameToDelete} berhasil dihapus.`, "Terhapus", "success");
                    }
                );
            };

            const openStudentModal = (student = null) => {
                if (!isAdmin) return;
                if (student) {
                    setEditingStudent(student);
                    setFormData({ photo: student.photo, nis: student.nis, name: student.name, gender: student.gender, class: student.class, parentName: student.parentName, parentPhone: student.parentPhone });
                } else {
                    setEditingStudent(null);
                    setFormData({ photo: '', nis: '', name: '', gender: 'L', class: classList[0] || 'VII-A', parentName: '', parentPhone: '' });
                }
                setShowModal(true);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <div className="flex items-center gap-2">
                                <h2 className="text-xl font-bold text-slate-900">Data Master Peserta Didik</h2>
                                <span className="px-2.5 py-0.5 bg-purple-100 text-purple-800 text-[10px] font-extrabold rounded-full border border-purple-300">
                                    <i className="fa-solid fa-lock mr-1"></i> Khusus Administrator
                                </span>
                            </div>
                            <p className="text-xs text-slate-500 mt-0.5">Kelola data siswa, edit nama kelas, dan centang untuk <b>Hapus Banyak Nama (Bulk Delete)</b>.</p>
                        </div>
                        {isAdmin && (
                            <div className="flex flex-wrap gap-2">
                                <button onClick={handleDownloadTemplate} className="px-3.5 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold rounded-xl text-xs flex items-center gap-1.5 border border-emerald-300">
                                    <i className="fa-solid fa-file-excel"></i>
                                    <span>Download Format Excel</span>
                                </button>

                                <label className="px-3.5 py-2 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold rounded-xl text-xs flex items-center gap-1.5 border border-blue-300 cursor-pointer">
                                    <i className="fa-solid fa-file-import"></i>
                                    <span>Upload Excel Data</span>
                                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleExcelUpload} className="hidden" />
                                </label>

                                <button onClick={() => setShowClassModal(true)} className="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 shadow">
                                    <i className="fa-solid fa-pen-to-square"></i>
                                    <span>Kelola & Edit Kelas</span>
                                </button>

                                <button onClick={() => openStudentModal()} className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow">
                                    <i className="fa-solid fa-plus"></i>
                                    <span>Tambah Siswa</span>
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between shadow-sm">
                        <div className="flex-1 w-full relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input 
                                type="text" 
                                value={search} 
                                onChange={e => setSearch(e.target.value)} 
                                placeholder="Cari NIS atau Nama Siswa..." 
                                className="w-full pl-9 pr-4 py-2 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-600"
                            />
                        </div>

                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <label className="text-xs font-bold text-slate-600 whitespace-nowrap">Filter Kelas:</label>
                            <select 
                                value={selectedClassFilter} 
                                onChange={e => setSelectedClassFilter(e.target.value)}
                                className="py-2 px-3 bg-slate-50 border rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-emerald-600 w-full md:w-48"
                            >
                                <option value="Semua">Semua Kelas ({students.length})</option>
                                {classList.map(c => (
                                    <option key={c} value={c}>Kelas {c}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {isAdmin && selectedIds.length > 0 && (
                        <div className="p-3 bg-rose-50 border border-rose-200 rounded-2xl flex items-center justify-between text-xs animate-in fade-in duration-200 shadow-sm">
                            <div className="flex items-center gap-2 font-bold text-rose-800">
                                <i className="fa-solid fa-check-double text-base"></i>
                                <span>{selectedIds.length} Nama Siswa Dicentang</span>
                            </div>
                            <button 
                                onClick={handleBulkDelete}
                                className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow"
                            >
                                <i className="fa-solid fa-trash-can"></i>
                                <span>Hapus Banyak Siswa Terpilih ({selectedIds.length})</span>
                            </button>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <table className="w-full text-xs text-left">
                            <thead className="bg-slate-50 text-slate-600 uppercase font-bold border-b">
                                <tr>
                                    {isAdmin && (
                                        <th className="p-4 text-center w-10">
                                            <input 
                                                type="checkbox" 
                                                checked={filtered.length > 0 && selectedIds.length === filtered.length}
                                                onChange={handleSelectAll}
                                                className="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                                                title="Pilih Semua Siswa"
                                            />
                                        </th>
                                    )}
                                    <th className="p-4 text-center">Foto Siswa</th>
                                    <th className="p-4">NIS</th>
                                    <th className="p-4">Nama Lengkap</th>
                                    <th className="p-4">Kelas</th>
                                    <th className="p-4">L/P</th>
                                    <th className="p-4">Orang Tua / Wali</th>
                                    <th className="p-4 text-center">Score Point (Base 0)</th>
                                    {isAdmin && <th className="p-4 text-center">Aksi (Admin)</th>}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 font-medium">
                                {filtered.map(s => {
                                    const points = studentPointsMap[s.id] !== undefined ? studentPointsMap[s.id] : 0;
                                    const isSelected = selectedIds.includes(s.id);
                                    const phoneVal = formatWaPhone(s.parentPhone);

                                    return (
                                        <tr key={s.id} className={`hover:bg-slate-50 transition ${isSelected ? 'bg-emerald-50/50' : ''}`}>
                                            {isAdmin && (
                                                <td className="p-4 text-center">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={isSelected}
                                                        onChange={() => handleToggleSelect(s.id)}
                                                        className="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                                                    />
                                                </td>
                                            )}
                                            <td className="p-3 text-center">
                                                <img src={s.photo} alt={s.name} className="w-10 h-10 rounded-full object-cover border border-slate-200 mx-auto shadow-sm" />
                                            </td>
                                            <td className="p-4 font-mono font-bold text-slate-700">{s.nis}</td>
                                            <td className="p-4 font-bold text-slate-900">{s.name}</td>
                                            <td className="p-4"><span className="px-2.5 py-1 bg-slate-100 rounded-lg font-bold text-slate-700">{s.class}</span></td>
                                            <td className="p-4">{s.gender}</td>
                                            <td className="p-4 text-slate-600">
                                                <div>{s.parentName}</div>
                                                <div className={`font-mono text-[11px] ${phoneVal.isValid ? 'text-slate-500' : 'text-rose-600 font-bold'}`}>
                                                    {phoneVal.formatted}
                                                </div>
                                            </td>
                                            <td className="p-4 text-center">
                                                <span className={`px-3 py-1 rounded-full font-extrabold text-xs shadow-sm ${
                                                    points > 0 ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' :
                                                    points === 0 ? 'bg-slate-100 text-slate-700 border border-slate-300' : 'bg-rose-100 text-rose-800 border border-rose-300'
                                                }`}>
                                                    {points > 0 ? `+${points}` : points} Pts
                                                </span>

                    setFormData(prev => ({ ...prev, studentId: "", date: todayStr }));

        // ==========================================
        // VIEW: REPORTS & WA PARENT AUTOMATION PANEL
        // ==========================================
        function ReportsView({ school, students, misconducts, goodConducts, classList, currentUser, setPrintModalData, studentPointsMap, setParentReportJpegModal, handleUpdateWaStatus, triggerNotice, setPreviewWaModalData }) {
            const [viewMode, setViewMode] = useState('QUEUE'); // 'QUEUE', 'MONITORING', 'PRINT'
            
            // Shared Filters for Queue & Monitoring
            const [categoryFilter, setCategoryFilter] = useState('ALL'); // 'ALL', 'GOOD', 'BAD'
            const [classFilter, setClassFilter] = useState('Semua');
            const [statusFilter, setStatusFilter] = useState('ALL'); // 'ALL', 'Belum Diproses', 'Menunggu Konfirmasi', 'Terkirim (Konfirmasi Petugas)', 'Gagal', 'Dilewati'
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            // Queue Engine State
            const [queueDelay, setQueueDelay] = useState(3); // seconds
            const [queueState, setQueueState] = useState('IDLE'); // 'IDLE', 'RUNNING', 'PAUSED'
            const [currentIndex, setCurrentIndex] = useState(0);
            const [confirmingItem, setConfirmingItem] = useState(null);

            // Combine all conducts into a unified dataset for parent report monitoring
            const combinedConducts = useMemo(() => {
                const list = [];
                goodConducts.forEach(g => {
                    list.push({ ...g, isGood: true, uniqueKey: `good_${g.id}` });
                });
                misconducts.forEach(m => {
                    list.push({ ...m, isGood: false, uniqueKey: `bad_${m.id}` });
                });
                // Sort by date descending
                return list.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [goodConducts, misconducts]);

            // Filtered Dataset
            const filteredConducts = useMemo(() => {
                return combinedConducts.filter(item => {
                    const student = students.find(s => s.id === item.studentId);
                    
                    const matchesSearch = student ? (
                        student.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        student.nis.includes(searchQuery) ||
                        (student.parentName && student.parentName.toLowerCase().includes(searchQuery.toLowerCase()))
                    ) : true;
                    
                    let matchesCategory = true;
                    if (categoryFilter === 'GOOD') matchesCategory = item.isGood;
                    if (categoryFilter === 'BAD') matchesCategory = !item.isGood;

                    let matchesClass = true;
                    if (classFilter !== 'Semua') {
                        matchesClass = (student?.class === classFilter) || (item.class === classFilter);
                    }

                    let matchesStatus = true;
                    if (statusFilter !== 'ALL') {
                        if (statusFilter === 'Terkirim') {
                            matchesStatus = item.waStatus && item.waStatus.includes('Terkirim');
                        } else {
                            matchesStatus = item.waStatus === statusFilter;
                        }
                    }

                    let matchesDate = true;
                    if (startDate) matchesDate = matchesDate && item.date >= startDate;
                    if (endDate) matchesDate = matchesDate && item.date <= endDate;

                    return matchesSearch && matchesCategory && matchesClass && matchesStatus && matchesDate;
                });
            }, [combinedConducts, students, searchQuery, categoryFilter, classFilter, statusFilter, startDate, endDate]);

            // Queue Statistics
            const stats = useMemo(() => {
                let waiting = 0, sent = 0, failed = 0, skipped = 0;
                combinedConducts.forEach(item => {
                    const st = item.waStatus || 'Belum Diproses';
                    if (st.includes('Terkirim')) sent++;
                    else if (st === 'Gagal') failed++;
                    else if (st === 'Dilewati') skipped++;
                    else waiting++;
                });
                return { total: combinedConducts.length, waiting, sent, failed, skipped };
            }, [combinedConducts]);

            // Action: Open WA link for single item
            const handleOpenWaForItem = (item, student, customText = null) => {
                const phoneRes = formatWaPhone(student?.parentPhone);
                if (!phoneRes.isValid) {
                    triggerNotice(
                        `Nomor telepon orang tua untuk ${student?.name || 'Siswa'} tidak valid (${student?.parentPhone || 'Kosong'}).
Harap perbarui nomor di menu Data Siswa terlebih dahulu.`,
                        "Nomor Tidak Valid",
                        "danger"
                    );
                    handleUpdateWaStatus(item.id, item.isGood, 'Gagal', 'Otomatis WA (Klik)', currentUser.name, 'Nomor tidak valid');
                    return false;
                }

                const narration = customText || buildWaTextNarration(item, item.isGood, student, school);
                const waUrl = `https://wa.me/${phoneRes.clean}?text=${encodeURIComponent(narration)}`;
                
                // Update status to 'Menunggu Konfirmasi' when WA is opened
                handleUpdateWaStatus(item.id, item.isGood, 'Menunggu Konfirmasi', 'Otomatis WA (Klik)', currentUser.name);

                const win = window.open(waUrl, '_blank');
                if (!win || win.closed || typeof win.closed === 'undefined') {
                    triggerNotice(
                        "Browser Anda memblokir pop-up tab baru.
Harap izinkan pop-up pada peramban ini, atau salin narasi pesan secara manual.",
                        "Pop-up Diblokir",
                        "danger"
                    );
                }

                setConfirmingItem({ item, student, narration });
                return true;
            };

            // Copy WA narration text for manual messaging
            const handleCopyNarration = (item, student) => {
                const narration = buildWaTextNarration(item, item.isGood, student, school);
                copyToClipboard(narration);
                handleUpdateWaStatus(item.id, item.isGood, 'Menunggu Konfirmasi', 'Salin Teks', currentUser.name);
                triggerNotice(
                    `Narasi teks laporan untuk orang tua ${student?.name || ''} telah disalin ke clipboard!

No. HP Orang Tua: ${student?.parentPhone || '-'}

Status diubah ke "Menunggu Konfirmasi". Tekan "Tandai Terkirim" setelah Anda mengirimkannya di WhatsApp.`,
                    "Narasi Teks Disalin",
                    "info"
                );
            };

            // Queue Execution Loop (Sequential processing)
            useEffect(() => {
                let timer = null;
                if (queueState === 'RUNNING' && !confirmingItem) {
                    if (currentIndex < filteredConducts.length) {
                        const targetItem = filteredConducts[currentIndex];
                        const targetStudent = students.find(s => s.id === targetItem.studentId);
                        
                        const currentStatus = targetItem.waStatus || 'Belum Diproses';
                        if (currentStatus.includes('Terkirim')) {
                            // Skip already sent items in running queue
                            setCurrentIndex(prev => prev + 1);
                        } else {
                            const success = handleOpenWaForItem(targetItem, targetStudent);
                            if (!success) {
                                // If phone invalid, pause or step forward after delay
                                timer = setTimeout(() => {
                                    setCurrentIndex(prev => prev + 1);
                                }, queueDelay * 1000);
                            } else {
                                // Pause queue execution until user confirms status modal
                                setQueueState('PAUSED');

        function WaPreviewEditModal({ modalData, school, students, currentUser, onClose, onUpdateWaStatus, triggerNotice }) {
            const { conduct, isGood } = modalData;
            const student = students.find(s => s.id === conduct.studentId);
            const [messageText, setMessageText] = useState(() => buildWaTextNarration(conduct, isGood, student, school));

            const handleSendNow = () => {
                const phoneRes = formatWaPhone(student?.parentPhone);
                if (!phoneRes.isValid) {
                    triggerNotice(`Nomor telepon orang tua tidak valid (${student?.parentPhone}).`, "Nomor Tidak Valid", "danger");
                    return;
                }
                const url = `https://wa.me/${phoneRes.clean}?text=${encodeURIComponent(messageText)}`;
                onUpdateWaStatus(conduct.id, isGood, 'Menunggu Konfirmasi', 'Otomatis WA (Klik)', currentUser?.name);
                window.open(url, '_blank');
                onClose();
                triggerNotice(`WhatsApp dibuka untuk ${student?.name}. Harap tekan Kirim di WhatsApp lalu konfirmasi status di aplikasi.`, "WhatsApp Dibuka", "info");
            };

            const handleCopy = () => {
                copyToClipboard(messageText);
                onUpdateWaStatus(conduct.id, isGood, 'Menunggu Konfirmasi', 'Salin Teks', currentUser?.name);
                triggerNotice("Narasi teks pesan WhatsApp disalin ke clipboard!", "Teks Disalin", "success");
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">

                                Preview & Edit Teks Pesan WhatsApp
                            </h3>

                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div className="p-3 bg-slate-50 rounded-2xl border space-y-1">
                            <p><b>Penerima:</b> {student?.parentName || 'Orang Tua/Wali'} ({student?.name})</p>
                            <p><b>No. HP Tujuan:</b> {student?.parentPhone || '-'} ({formatWaPhone(student?.parentPhone).formatted})</p>
                        </div>

                        <div>
                            <label className="block font-bold text-slate-700 mb-1">Isi Pesan WhatsApp (Dapat Diedit):</label>
                            <textarea 
                                rows="12" 
                                value={messageText} 
                                onChange={e => setMessageText(e.target.value)} 
                                className="w-full p-3.5 bg-slate-50 border rounded-2xl font-mono text-xs leading-relaxed focus:ring-2 focus:ring-emerald-600 outline-none"
                            ></textarea>
                        </div>

                        <div className="flex flex-wrap justify-between items-center gap-2 pt-2 border-t">
                            <button onClick={handleCopy} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl flex items-center gap-1.5 border">
                                <i className="fa-solid fa-copy"></i> Salin Teks
                            </button>

                            <div className="flex items-center gap-2">
                                <button onClick={onClose} className="px-4 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl">Batal</button>
                                <button onClick={handleSendNow} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow flex items-center gap-2">

                                    <span>Buka WhatsApp & Lanjutkan</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                        const ws = workbook.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        const importedUsers = data.map((row, index) => {
                            const role = String(row["Peran (Administrator/Management/Kepala Sekolah/SCM Team/Guru)"] || "Guru");
                            let roleBadge = "bg-amber-100 text-amber-800 border-amber-300";
                            if (role === 'Administrator') roleBadge = "bg-purple-100 text-purple-800 border-purple-300";
                            if (role === 'Management') roleBadge = "bg-blue-100 text-blue-800 border-blue-300";
                            if (role === 'Kepala Sekolah') roleBadge = "bg-indigo-100 text-indigo-800 border-indigo-300";
                            if (role === 'SCM Team') roleBadge = "bg-emerald-100 text-emerald-800 border-emerald-300";

                            return {
                                id: Date.now() + index,
                                name: String(row["Nama Pengguna"] || "Pengguna Baru"),
                                username: String(row["Username"] || `user${index + 1}`),
                                email: String(row["Email"] || `user${index + 1}@sekolah.sch.id`),
                                password: String(row["Password"] || "123"),

                                signature: SAMPLE_SIG,
                                roleBadge,
                                active: true

                        });

                        setUsers([...importedUsers, ...users]);
                        triggerNotice(`Berhasil mengimpor ${importedUsers.length} akun pengguna!`, "Sukses", "success");
                    } catch (err) {
                        triggerNotice("Gagal membaca file Excel Pengguna.", "Error", "danger");
                    }

                reader.readAsBinaryString(file);
            };

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData({ ...formData, photo: reader.result });

            const handleSave = (e) => {

                            </p>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">

        // ==========================================
        // CONDUCT SLIP REPORT JPEG MODAL
        // ==========================================
        function ConductSlipJpegModal({ conductData, school, students, users, currentUser, onClose, onUpdateWaStatus, triggerNotice, setPreviewWaModalData }) {
            const slipRef = useRef(null);
            const [downloading, setDownloading] = useState(false);

            const { conduct, isGood } = conductData;

            const student = students.find(s => s.id === conduct.studentId);
            const reporterUser = users.find(u => u.id === conduct.reporterId || u.name === conduct.reporter) || users[4];

            const ruleDesc = getRuleDescription(conduct.ruleId, isGood);
            const dayName = getDayNameIndonesian(conduct.date);

            // Export to JPEG using html2canvas
            const handleDownloadJpeg = () => {
                if (!slipRef.current) return;
                setDownloading(true);
                
                html2canvas(slipRef.current, { scale: 2.5, useCORS: true, logging: false, backgroundColor: '#ffffff' })
                    .then(canvas => {
                        const link = document.createElement('a');
                        const prefix = isGood ? 'GOOD_CONDUCTS_SLIP' : 'MISCONDUCTS_SLIP';
                        link.download = `${prefix}_${student?.name || 'Siswa'}_${conduct.date}.jpg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.95);
                        link.click();
                        setDownloading(false);
                        triggerNotice("Slip Laporan berhasil diunduh dalam format JPEG!", "Sukses Unduh", "success");
                    })
                    .catch(err => {
                        setDownloading(false);
                        triggerNotice("Gagal mengunduh gambar JPEG: " + err.message, "Gagal", "danger");
                    });
            };

            const handleSendWa = () => {
                const phoneRes = formatWaPhone(student?.parentPhone);
                if (!phoneRes.isValid) {
                    triggerNotice(`Nomor WhatsApp orang tua tidak valid (${student?.parentPhone || 'Kosong'}).`, "Nomor Tidak Valid", "danger");
                    return;
                }
                const narration = buildWaTextNarration(conduct, isGood, student, school);
                const url = `https://wa.me/${phoneRes.clean}?text=${encodeURIComponent(narration)}`;
                
                onUpdateWaStatus(conduct.id, isGood, 'Menunggu Konfirmasi', 'Otomatis WA (Klik)', currentUser?.name);
                window.open(url, '_blank');
                triggerNotice(`WhatsApp dibuka. Harap klik tombol Kirim di WhatsApp lalu tandai status di aplikasi.`, "WhatsApp Dibuka", "info");
            };

            const handleCopyNarration = () => {
                const narration = buildWaTextNarration(conduct, isGood, student, school);
                copyToClipboard(narration);
                onUpdateWaStatus(conduct.id, isGood, 'Menunggu Konfirmasi', 'Salin Teks', currentUser?.name);
                triggerNotice(`Narasi teks laporan telah disalin ke clipboard!

No. HP Orang Tua: ${student?.parentPhone}`, "Narasi Disalin", "success");
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[95vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 className="text-base font-extrabold text-slate-900">Preview {isGood ? 'GOOD CONDUCTS SLIP' : 'MISCONDUCTS SLIP'}</h3>
                                <p className="text-xs text-slate-500">Format resmi sesuai lampiran (Tahun Ajaran <b>{school.academicYear}</b>).</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>

                        {/* SLIP CARD */}
                        <div ref={slipRef} className="bg-white p-6 border-2 border-slate-900 text-slate-900 text-xs font-sans space-y-0">
                            
                            {/* KOP HEADER WITH SCHOOL LOGO & NAME */}
                            <div className="flex items-center justify-between border-b-2 border-slate-900 pb-3 mb-3">
                                <img src={school.logoUrl} alt="Logo" className="w-16 h-16 object-contain" />
                                <div className="text-right">
                                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700">{school.parentOrg}</h4>
                                    <h2 className="text-lg font-black uppercase text-amber-800 font-serif-header tracking-tight">{school.name}</h2>
                                    <p className="text-[9px] text-slate-500 font-bold">Tahun Ajaran {school.academicYear} • Semester {school.semester}</p>
                                </div>
                            </div>

                            {/* SLIP BANNER TITLE */}
                            <div className={`py-2 px-4 text-center font-extrabold text-sm uppercase mb-3 border border-slate-900 tracking-wider text-white ${
                                isGood ? 'bg-emerald-800' : 'bg-amber-900'
                            }`}>
                                {isGood ? 'GOOD CONDUCTS SLIP' : 'MISCONDUCTS SLIP'}
                            </div>

                            {/* MAIN DATA TABLE */}
                            <table className="w-full border-collapse border border-slate-900 text-xs">
                                <tbody>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50 w-28">Name :</td>
                                        <td className="border border-slate-900 p-2 font-bold text-slate-900" colSpan={3}>
                                            {student?.name || "Nama Siswa"}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">Class :</td>
                                        <td className="border border-slate-900 p-2 font-bold" colSpan={3}>
                                            {student?.class || conduct.class}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">Day :</td>
                                        <td className="border border-slate-900 p-2 font-bold" colSpan={3}>
                                            {dayName}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">Date :</td>
                                        <td className="border border-slate-900 p-2 font-bold" colSpan={3}>
                                            {conduct.date}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">Level :</td>
                                        <td className="border border-slate-900 p-2 font-bold text-slate-900" colSpan={3}>
                                            {conduct.level} ({isGood ? `+${conduct.pts} Pts` : `${conduct.pts} Pts`})
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">Deskripsi :</td>
                                        <td className="border border-slate-900 p-2" colSpan={3}>
                                            <div className="font-bold text-slate-900 mb-1">{ruleDesc}</div>
                                            {conduct.description && <div className="text-slate-700 italic">Catatan: {conduct.description}</div>}
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-2 font-bold bg-slate-50">
                                            {isGood ? 'Reward / Apresiasi :' : 'Consequence :'}
                                        </td>
                                        <td className="border border-slate-900 p-2 font-bold text-slate-900" colSpan={3}>
                                            {isGood ? (conduct.reward || "Piagam / Apresiasi Sekolah") : (conduct.consequence || "Pembinaan sesuai aturan sekolah")}
                                        </td>
                                    </tr>

                                    {/* SIGNATURE ROW */}
                                    <tr>
                                        <td className="border border-slate-900 p-3 text-center font-bold bg-slate-50" colSpan={2}>
                                            Teacher’s Signature
                                        </td>
                                        <td className="border border-slate-900 p-3 text-center font-bold bg-slate-50" colSpan={2}>
                                            Student’s Signature
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="border border-slate-900 p-4 text-center h-20 align-bottom" colSpan={2}>
                                            {reporterUser?.signature ? (
                                                <img src={reporterUser.signature} alt="TTD Guru" className="h-12 object-contain mx-auto mb-1" />
                                            ) : (
                                                <div className="h-10"></div>
                                            )}
                                            <span className="font-bold border-t border-slate-900 pt-1 px-4 inline-block">{reporterUser?.name || "Guru Pelapor"}</span>
                                        </td>
                                        <td className="border border-slate-900 p-4 text-center h-20 align-bottom" colSpan={2}>
                                            {conduct.signature ? (
                                                <img src={conduct.signature} alt="TTD Siswa" className="h-12 object-contain mx-auto mb-1" />
                                            ) : (
                                                <div className="h-10"></div>
                                            )}
                                            <span className="font-bold border-t border-slate-900 pt-1 px-4 inline-block">{student?.name || "Siswa"}</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <div className="text-[9px] text-slate-400 text-center pt-2 italic">
                                Slip Laporan Resmi SCMS {school.name} • Tahun Ajaran {school.academicYear}
                            </div>
                        </div>

                        {/* Modal Action Buttons */}
                        <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t">
                            <div className="flex items-center gap-2">
                                <button onClick={handleSendWa} className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow">
                                    <i className="fa-brands fa-whatsapp text-sm"></i>
                                    <span>Buka WA Narasi</span>
                                </button>
                                <button onClick={() => setPreviewWaModalData(conductData)} className="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs border">
                                    <i className="fa-solid fa-pen-to-square mr-1"></i> Preview / Edit Teks
                                </button>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={onClose} className="px-4 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">
                                    Tutup
                                </button>
                                <button onClick={handleDownloadJpeg} disabled={downloading} className="px-5 py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow">
                                    <i className="fa-solid fa-download"></i>
                                    <span>{downloading ? 'Mengunduh...' : 'Unduh Slip Format JPEG'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
